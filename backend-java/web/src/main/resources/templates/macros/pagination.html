<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  用法示例（在页面中）:
  <nav th:replace="~{macros/pagination :: nav(3, 10, @{/search(q=${param.q})})}"></nav>
  参数：当前页码(1-based)、总页数、带 page= 占位的基础 URL（需自行在模板中拼 &page=）
-->
<th:block th:fragment="simple(prevUrl, nextUrl)">
    <nav class="mt-3" th:if="${prevUrl != null or nextUrl != null}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${prevUrl == null} ? ' disabled'">
                <a class="page-link" th:href="${prevUrl}">上一页</a>
            </li>
            <li class="page-item" th:classappend="${nextUrl == null} ? ' disabled'">
                <a class="page-link" th:href="${nextUrl}">下一页</a>
            </li>
        </ul>
    </nav>
</th:block>
</body>
</html>
