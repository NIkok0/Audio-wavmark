<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${mediaLabel} + ' - 数字水印系统'">媒体处理 - 数字水印系统</title>
    <th:block th:replace="~{base :: commonHead}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        .media-shell { max-width: 1180px; }
        .media-hero {
            border-radius: 8px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            border: 1px solid #dbe4ff;
            padding: 24px;
        }
        .media-icon {
            width: 56px; height: 56px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            background: #0d6efd; color: #fff; font-size: 28px;
        }
        .media-action-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            height: 100%;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .media-action-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,.08); }
        .upload-drop {
            border: 2px dashed #9ca3af;
            border-radius: 8px;
            padding: 28px;
            background: #f9fafb;
            text-align: center;
        }
        .upload-drop.dragover { border-color: #0d6efd; background: #eff6ff; }
        .file-row { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
        .file-row + .file-row { margin-top: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-pending { background: #f59e0b; }
        .status-done { background: #10b981; }
        .status-error { background: #ef4444; }
        .small-muted { color: #6b7280; font-size: .875rem; }
    </style>
</head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<aside th:replace="~{base :: sidebar}"></aside>

<main class="container py-4 with-sidebar media-shell"
      th:attr="data-media=${media},data-step=${stepKey},data-accepts=${accepts}">
    <div class="media-hero mb-4">
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <span class="media-icon"><i th:class="'bi ' + ${mediaIcon}"></i></span>
            <div class="flex-grow-1">
                <h1 class="h3 mb-1" th:text="${mediaLabel} + '水印处理'">媒体水印处理</h1>
                <div class="small-muted">上传文件、嵌入水印、下载结果，并查看任务处理状态。</div>
            </div>
            <div class="btn-group">
                <a class="btn btn-outline-primary" th:classappend="${stepKey == 'process'} ? ' active'" th:href="${processUrl}">流程</a>
                <a class="btn btn-outline-primary" th:classappend="${stepKey == 'upload'} ? ' active'" th:href="${uploadUrl}">上传</a>
                <a class="btn btn-outline-primary" th:classappend="${stepKey == 'add'} ? ' active'" th:href="${addUrl}">加水印</a>
                <a class="btn btn-outline-primary" th:classappend="${stepKey == 'extract'} ? ' active'" th:href="${extractUrl}">提取</a>
            </div>
        </div>
    </div>

    <div id="alertHost"></div>

    <section th:if="${stepKey == 'process'}">
        <div class="row g-3">
            <div class="col-md-4">
                <a class="media-action-card d-block p-4 text-decoration-none text-dark" th:href="${uploadUrl}">
                    <i class="bi bi-cloud-upload h2 text-primary"></i>
                    <h2 class="h5 mt-3">上传文件</h2>
                    <p class="small-muted mb-0">选择本地文件上传到系统，上传成功后自动出现在文件列表。</p>
                </a>
            </div>
            <div class="col-md-4">
                <a class="media-action-card d-block p-4 text-decoration-none text-dark" th:href="${addUrl}">
                    <i class="bi bi-shield-plus h2 text-success"></i>
                    <h2 class="h5 mt-3">嵌入水印</h2>
                    <p class="small-muted mb-0">选择未处理文件，输入水印文本，提交异步任务。</p>
                </a>
            </div>
            <div class="col-md-4">
                <a class="media-action-card d-block p-4 text-decoration-none text-dark" th:href="${extractUrl}">
                    <i class="bi bi-search h2 text-info"></i>
                    <h2 class="h5 mt-3">提取水印</h2>
                    <p class="small-muted mb-0">第一阶段保留入口；提取任务接口接入后可直接启用。</p>
                </a>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header bg-white fw-semibold">最近文件</div>
            <div class="card-body"><div id="recentFiles"></div></div>
        </div>
    </section>

    <section th:if="${stepKey == 'upload'}">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="upload-drop" id="dropZone">
                    <i class="bi bi-cloud-arrow-up display-5 text-primary"></i>
                    <h2 class="h5 mt-3">选择或拖拽文件上传</h2>
                    <p class="small-muted">支持格式：<span th:text="${accepts}">files</span></p>
                    <input class="form-control" type="file" id="fileInput" multiple th:attr="accept=${accepts}"/>
                    <button class="btn btn-success mt-3" id="uploadBtn" type="button">
                        <i class="bi bi-upload"></i> 开始上传
                    </button>
                </div>
                <div id="uploadQueue" class="mt-3"></div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header bg-white fw-semibold">文件列表</div>
                    <div class="card-body"><div id="fileList"></div></div>
                </div>
            </div>
        </div>
    </section>

    <section th:if="${stepKey == 'add'}">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header bg-white fw-semibold">提交水印任务</div>
                    <div class="card-body">
                        <label class="form-label" for="watermarkText">水印文本</label>
                        <textarea class="form-control" id="watermarkText" rows="4" placeholder="请输入要嵌入的水印内容"></textarea>
                        <button class="btn btn-primary mt-3" id="enqueueBtn" type="button" disabled>
                            <i class="bi bi-send"></i> 提交任务
                        </button>
                        <div id="jobStatus" class="mt-3 small-muted"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header bg-white fw-semibold">选择文件</div>
                    <div class="card-body"><div id="fileList"></div></div>
                </div>
            </div>
        </div>
    </section>

    <section th:if="${stepKey == 'extract'}">
        <div class="card">
            <div class="card-header bg-white fw-semibold">提取水印</div>
            <div class="card-body">
                <div class="alert alert-info mb-4">
                    提取水印页面已迁移。当前 Java 后端尚未提供提取任务接口，第一阶段先保留文件选择和入口提示。
                </div>
                <div id="fileList"></div>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{base :: bootstrapJs}"/>
<script th:inline="javascript">
(() => {
    const root = document.querySelector('main.media-shell');
    const media = root.dataset.media;
    const step = root.dataset.step;
    let selectedFileId = null;

    const alertHost = document.getElementById('alertHost');
    const showAlert = (type, message) => {
        alertHost.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    };
    const formatSize = (n) => {
        if (!n && n !== 0) return '-';
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = Number(n), i = 0;
        while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
        return `${size.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    };
    const api = async (url, options = {}) => {
        const res = await fetch(url, {credentials: 'same-origin', ...options});
        if (!res.ok) {
            const text = await res.text();
            throw new Error(text || `${res.status} ${res.statusText}`);
        }
        if (res.status === 204) return null;
        return res.json();
    };
    const renderFiles = (host, files, selectable) => {
        if (!host) return;
        if (!files.length) {
            host.innerHTML = '<div class="text-center text-muted py-4">暂无文件</div>';
            return;
        }
        host.innerHTML = files.map(f => `
            <div class="file-row" data-id="${f.id}">
                <div class="d-flex justify-content-between gap-3 flex-wrap">
                    <div>
                        <div class="fw-semibold">${f.filename}</div>
                        <div class="small-muted">${formatSize(f.fileSize)} · ${f.mimeType || '-'} · ${f.processingStatus || 'pending'}</div>
                    </div>
                    <div class="d-flex gap-2 align-items-start">
                        ${selectable ? `<button class="btn btn-sm btn-outline-primary select-file" data-id="${f.id}">选择</button>` : ''}
                        <a class="btn btn-sm btn-outline-success" href="/api/v1/files/${f.id}/content">下载</a>
                        <button class="btn btn-sm btn-outline-danger delete-file" data-id="${f.id}">删除</button>
                    </div>
                </div>
            </div>`).join('');
        host.querySelectorAll('.delete-file').forEach(btn => btn.addEventListener('click', async () => {
            if (!confirm('确定删除这个文件吗？')) return;
            await api(`/api/v1/files/${btn.dataset.id}`, {method: 'DELETE'});
            showAlert('success', '文件已删除');
            await loadFiles();
        }));
        host.querySelectorAll('.select-file').forEach(btn => btn.addEventListener('click', () => {
            selectedFileId = Number(btn.dataset.id);
            document.querySelectorAll('.file-row').forEach(x => x.classList.remove('border-primary'));
            btn.closest('.file-row').classList.add('border-primary');
            const enqueueBtn = document.getElementById('enqueueBtn');
            if (enqueueBtn) enqueueBtn.disabled = false;
        }));
    };
    const loadFiles = async () => {
        const data = await api(`/api/v1/files?fileType=${encodeURIComponent(media)}&size=50`);
        const files = data.content || [];
        renderFiles(document.getElementById('fileList'), files, step === 'add');
        renderFiles(document.getElementById('recentFiles'), files.slice(0, 5), false);
    };
    const uploadFiles = async () => {
        const input = document.getElementById('fileInput');
        const queue = document.getElementById('uploadQueue');
        const files = Array.from(input.files || []);
        if (!files.length) {
            showAlert('warning', '请先选择文件');
            return;
        }
        queue.innerHTML = '';
        for (const file of files) {
            const row = document.createElement('div');
            row.className = 'small-muted mb-2';
            row.textContent = `${file.name} 上传中...`;
            queue.appendChild(row);
            const form = new FormData();
            form.append('mediaType', media);
            form.append('file', file);
            try {
                await api('/api/v1/files', {method: 'POST', body: form});
                row.innerHTML = `<span class="status-dot status-done"></span>${file.name} 上传成功`;
            } catch (e) {
                row.innerHTML = `<span class="status-dot status-error"></span>${file.name} 上传失败`;
            }
        }
        input.value = '';
        await loadFiles();
    };
    const enqueue = async () => {
        const text = document.getElementById('watermarkText').value.trim();
        if (!selectedFileId) return showAlert('warning', '请选择文件');
        if (!text) return showAlert('warning', '请输入水印文本');
        const job = await api('/api/v1/jobs/watermark', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Idempotency-Key': `${selectedFileId}-${Date.now()}`},
            body: JSON.stringify({fileId: selectedFileId, watermarkText: text})
        });
        const host = document.getElementById('jobStatus');
        host.innerHTML = `任务已提交：<code>${job.jobId}</code>，状态 ${job.status}`;
        pollJob(job.jobId, host);
    };
    const pollJob = (jobId, host) => {
        let count = 0;
        const timer = setInterval(async () => {
            count++;
            try {
                const job = await api(`/api/v1/jobs/${jobId}`);
                host.innerHTML = `任务 <code>${jobId}</code>：${job.status}`;
                if (['COMPLETED', 'FAILED'].includes(job.status) || count > 30) clearInterval(timer);
            } catch (e) {
                clearInterval(timer);
            }
        }, 3000);
    };

    document.getElementById('uploadBtn')?.addEventListener('click', uploadFiles);
    document.getElementById('enqueueBtn')?.addEventListener('click', enqueue);
    const dropZone = document.getElementById('dropZone');
    if (dropZone) {
        ['dragenter', 'dragover'].forEach(name => dropZone.addEventListener(name, e => {
            e.preventDefault(); dropZone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(name => dropZone.addEventListener(name, e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
        }));
        dropZone.addEventListener('drop', e => {
            document.getElementById('fileInput').files = e.dataTransfer.files;
        });
    }
    loadFiles().catch(e => showAlert('danger', e.message));
})();
</script>
</body>
</html>
