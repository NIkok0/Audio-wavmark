<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>文件保留设置 - 数字水印系统</title>
    <th:block th:replace="~{base :: commonHead}"/>
</head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<aside th:replace="~{base :: sidebar}"></aside>

<main class="container py-4 with-sidebar">
    <section class="wm-page-hero mb-4">
        <div>
            <span class="wm-kicker">Retention</span>
            <h1>文件保留天数</h1>
            <p>设置个人文件自动保留周期，减少长期堆积的临时素材。</p>
        </div>
        <div class="wm-hero-sticker">
            <i class="bi bi-calendar2-week"></i>
        </div>
    </section>

    <section class="wm-panel wm-main-center-narrow">
        <div class="d-flex align-items-start gap-3 mb-4">
            <div class="wm-icon-bubble">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <div>
                <h2 class="h5 mb-1">保留策略</h2>
                <p class="text-muted mb-0">接口对应 <code>PATCH /api/v1/users/me/retention</code>，可设置 1 到 365 天。</p>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="days">保留天数</label>
            <input type="number" min="1" max="365" class="form-control form-control-lg" id="days" value="7"/>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-primary" id="saveBtn"><i class="bi bi-check2-circle"></i> 保存设置</button>
            <button type="button" class="btn btn-outline-secondary" data-days="7">7 天</button>
            <button type="button" class="btn btn-outline-secondary" data-days="30">30 天</button>
            <button type="button" class="btn btn-outline-secondary" data-days="90">90 天</button>
        </div>
        <div class="alert mt-3 d-none" id="msg"></div>
    </section>
</main>
<th:block th:replace="~{base :: bootstrapJs}"/>
<script>
    function readCookie(name) {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
    }

    document.querySelectorAll('[data-days]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('days').value = this.dataset.days;
        });
    });

    document.getElementById('saveBtn').addEventListener('click', async function () {
        const daysInput = document.getElementById('days');
        const days = parseInt(daysInput.value, 10);
        const msg = document.getElementById('msg');
        msg.className = 'alert mt-3 d-none';

        if (!Number.isInteger(days) || days < 1 || days > 365) {
            msg.classList.remove('d-none');
            msg.classList.add('alert-warning');
            msg.textContent = '请输入 1 到 365 之间的天数。';
            return;
        }

        const xsrf = readCookie('XSRF-TOKEN');
        const res = await fetch('/api/v1/users/me/retention', {
            method: 'PATCH',
            credentials: 'same-origin',
            headers: Object.assign({'Content-Type': 'application/json'}, xsrf ? {'X-XSRF-TOKEN': xsrf} : {}),
            body: JSON.stringify({retentionDays: days})
        });

        msg.classList.remove('d-none');
        if (res.ok) {
            msg.classList.add('alert-success');
            msg.textContent = '已保存，新的文件保留天数为 ' + days + ' 天。';
        } else {
            msg.classList.add('alert-danger');
            msg.textContent = '保存失败：' + res.status + ' ' + await res.text();
        }
    });
</script>
</body>
</html>
