<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>注册 - 数字水印系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body class="wm-auth-hero-page">
<div class="wm-auth-shell">
    <nav class="wm-auth-nav" aria-label="注册页导航">
        <a class="wm-auth-brandline" th:href="@{/}">
            <span class="wm-brand-mark"><i class="bi bi-stars"></i></span>
            <span>数字水印系统</span>
        </a>
        <a th:href="@{/signin}">登录</a>
    </nav>

    <main class="wm-auth-hero">
        <section class="wm-auth-copy">
            <span class="wm-kicker">Create Account</span>
            <h1>创建你的水印工作台账号</h1>
            <p>注册后即可上传媒体文件、提交水印任务，并在权限范围内管理文件保留策略。</p>
        </section>

        <section class="wm-auth-panel">
            <div class="mb-4">
                <h2 class="h4 fw-bold mb-2">注册账号</h2>
                <p class="mb-0 text-white-50">用一个账号开始管理你的媒体水印流程。</p>
            </div>
            <div id="api-error" class="alert alert-danger d-none">
                <strong>注册失败：</strong><span id="api-error-text"></span>
            </div>
            <form id="register-form" action="#" onsubmit="return false;">
                <div class="form-group mb-3" id="username-group">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-container">
                        <span class="input-icon"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control input-with-icon" placeholder="请输入 3-64 位用户名" autofocus id="username" name="username" autocomplete="username"/>
                    </div>
                    <div class="error-message" id="username-error">请输入有效用户名</div>
                </div>

                <div class="form-group mb-3" id="email-group">
                    <label for="email" class="form-label">邮箱</label>
                    <div class="input-container">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control input-with-icon" placeholder="请输入邮箱" id="email" name="email" autocomplete="email"/>
                    </div>
                    <div class="error-message" id="email-error">请输入有效邮箱</div>
                </div>

                <div class="form-group mb-4" id="password-group">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-container">
                        <span class="input-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control input-with-icon" placeholder="至少 6 位密码" id="password" name="password" autocomplete="new-password"/>
                    </div>
                    <div class="error-message" id="password-error">密码至少 6 位</div>
                </div>

                <button type="button" class="btn wm-primary-btn w-100 py-2" id="registerBtn">注册</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top border-light border-opacity-10">
                <span class="text-white-50 small">已经有账号？</span>
                <a th:href="@{/signin}" class="fw-bold text-decoration-none text-white">去登录</a>
            </div>
        </section>
    </main>
</div>
<script>
    function validateForm() {
        let ok = true;
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        ['username-group', 'email-group', 'password-group'].forEach(function (id) {
            document.getElementById(id).classList.remove('has-error');
        });
        if (username.length < 3 || username.length > 64) {
            document.getElementById('username-group').classList.add('has-error');
            ok = false;
        }
        if (!emailOk) {
            document.getElementById('email-group').classList.add('has-error');
            ok = false;
        }
        if (!password || password.length < 6) {
            document.getElementById('password-group').classList.add('has-error');
            ok = false;
        }
        return ok;
    }

    function setLoading(loading) {
        const btn = document.getElementById('registerBtn');
        btn.disabled = loading;
        btn.textContent = loading ? '注册中...' : '注册';
        btn.style.opacity = loading ? '0.7' : '1';
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.form-control').forEach(function (input) {
            input.addEventListener('focus', function () {
                this.closest('.form-group').classList.remove('has-error');
            });
        });

        document.getElementById('registerBtn').addEventListener('click', async function () {
            const apiErr = document.getElementById('api-error');
            const apiErrText = document.getElementById('api-error-text');
            apiErr.classList.add('d-none');
            if (!validateForm()) {
                return;
            }
            setLoading(true);
            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                if (res.status === 201) {
                    window.location.href = '/signin';
                    return;
                }
                let msg = '注册请求失败';
                try {
                    const body = await res.json();
                    if (body && body.detail) {
                        msg = body.detail;
                    }
                } catch (e) {
                }
                apiErrText.textContent = msg;
                apiErr.classList.remove('d-none');
            } catch (e) {
                apiErrText.textContent = '网络异常，请稍后再试';
                apiErr.classList.remove('d-none');
            } finally {
                setLoading(false);
            }
        });
    });
</script>
</body>
</html>
