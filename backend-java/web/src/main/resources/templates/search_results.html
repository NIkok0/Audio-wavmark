<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>搜索结果 - 数字水印系统</title>
    <th:block th:replace="~{base :: commonHead}"/>
</head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<aside th:replace="~{base :: sidebar}"></aside>

<main class="container py-4 with-sidebar">
    <h1 class="h4 mb-3">搜索文件</h1>
    <form class="row g-2 mb-4" method="get" th:action="@{/search}">
        <div class="col-md-8">
            <input class="form-control" name="q" placeholder="文件名关键字" th:value="${param.q}"/>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100" type="submit">搜索</button>
        </div>
    </form>
    <div id="results" class="small text-muted">在登录状态下通过 <code>GET /api/v1/files?q=...</code> 拉取结果。</div>
    <table class="table table-sm table-striped d-none" id="tbl">
        <thead><tr><th>ID</th><th>文件名</th><th>类型</th><th>大小</th><th>状态</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</main>
<th:block th:replace="~{base :: bootstrapJs}"/>
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const params = new URLSearchParams(window.location.search);
        const q = (params.get('q') || '').trim();
        const results = document.getElementById('results');
        const tbl = document.getElementById('tbl');
        const tbody = document.getElementById('tbody');
        if (!q) {
            results.textContent = '请输入关键字后搜索。';
            return;
        }
        const res = await fetch('/api/v1/files?q=' + encodeURIComponent(q) + '&page=0&size=20', {credentials: 'same-origin'});
        if (!res.ok) {
            results.textContent = '请求失败：' + res.status;
            return;
        }
        const data = await res.json();
        results.textContent = '共 ' + data.totalElements + ' 条';
        tbl.classList.remove('d-none');
        (data.content || []).forEach(function (f) {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>' + f.id + '</td><td>' + (f.filename || '') + '</td><td>' + (f.fileType || '') + '</td><td>' + f.fileSize + '</td><td>' + (f.processingStatus || '') + '</td>';
            tbody.appendChild(tr);
        });
    });
</script>
</body>
</html>
