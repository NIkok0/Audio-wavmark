<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>登录 - 数字水印系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body class="wm-auth-hero-page">
<div class="wm-auth-shell">
    <nav class="wm-auth-nav" aria-label="登录页导航">
        <a class="wm-auth-brandline" th:href="@{/}">
            <span class="wm-brand-mark"><i class="bi bi-stars"></i></span>
            <span>数字水印系统</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/register}">注册</a>
        </div>
    </nav>

    <main class="wm-auth-hero">
        <section class="wm-auth-copy">
            <span class="wm-kicker">Watermark Studio</span>
            <h1>让水印处理更轻、更快、更可靠</h1>
            <p>统一管理图片、音频、视频和文档水印任务，从上传到处理状态都在一个工作台里完成。</p>
        </section>

        <section class="wm-auth-panel">
            <div class="mb-4">
                <h2 class="h4 fw-bold mb-2">登录工作台</h2>
                <p class="mb-0 text-white-50">继续处理你的媒体文件和水印任务。</p>
            </div>
            <div id="api-error" class="alert alert-danger d-none">
                <strong>登录失败：</strong><span id="api-error-text"></span>
            </div>
            <form id="kc-form-login" action="#" onsubmit="return false;">
                <div class="form-group mb-3" id="username-group">
                    <label for="username" class="form-label">用户名或邮箱</label>
                    <div class="input-container">
                        <span class="input-icon"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control input-with-icon" placeholder="请输入用户名或邮箱" autofocus id="username" name="username" autocomplete="username"/>
                    </div>
                    <div class="error-message" id="username-error">请输入用户名或邮箱</div>
                </div>

                <div class="form-group mb-3" id="password-group">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-container">
                        <span class="input-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control input-with-icon" placeholder="请输入密码" id="password" name="password" autocomplete="current-password"/>
                    </div>
                    <div class="error-message" id="password-error">请输入密码</div>
                </div>

                <div class="wm-auth-cta-row mb-4">
                    <label class="form-check-label small text-white-50"><input type="checkbox" class="form-check-input me-1" id="rememberMe" name="rememberMe"/> 记住我</label>
                    <a href="#" class="small text-decoration-none text-white-50">忘记密码？</a>
                </div>

                <button type="button" class="btn wm-primary-btn w-100 py-2" id="loginBtn">登录</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top border-light border-opacity-10">
                <span class="text-white-50 small">还没有账号？</span>
                <a th:href="@{/register}" class="fw-bold text-decoration-none text-white">立即注册</a>
            </div>
        </section>
    </main>

    <section class="wm-auth-preview" aria-label="工作台预览">
        <div class="wm-auth-preview-bar">
            <span class="wm-auth-preview-dot"></span>
            <span class="wm-auth-preview-dot"></span>
            <span class="wm-auth-preview-dot"></span>
        </div>
        <div class="wm-auth-preview-body">
            <div class="wm-auth-preview-sidebar">
                <div class="fw-bold mb-3"><i class="bi bi-shield-check"></i> Watermark Flow</div>
                <div class="wm-preview-line"></div>
                <div class="wm-preview-line short"></div>
                <div class="wm-preview-line"></div>
            </div>
            <div class="wm-auth-preview-main">
                <div class="wm-preview-line"></div>
                <div class="wm-preview-line short"></div>
                <div class="wm-preview-status">
                    <div class="wm-preview-chip"><strong>4</strong><span>媒体类型</span></div>
                    <div class="wm-preview-chip"><strong>UP</strong><span>任务服务</span></div>
                    <div class="wm-preview-chip"><strong>安全</strong><span>权限隔离</span></div>
                </div>
            </div>
        </div>
    </section>
</div>
<script>
    function validateForm() {
        let ok = true;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const usernameGroup = document.getElementById('username-group');
        const passwordGroup = document.getElementById('password-group');
        usernameGroup.classList.remove('has-error');
        passwordGroup.classList.remove('has-error');
        if (!username || !username.trim()) {
            usernameGroup.classList.add('has-error');
            ok = false;
        }
        if (!password || !password.trim()) {
            passwordGroup.classList.add('has-error');
            ok = false;
        }
        return ok;
    }

    function setLoading(loading) {
        const btn = document.getElementById('loginBtn');
        btn.disabled = loading;
        btn.textContent = loading ? '登录中...' : '登录';
        btn.style.opacity = loading ? '0.7' : '1';
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.form-control').forEach(function (input) {
            input.addEventListener('focus', function () {
                this.closest('.form-group').classList.remove('has-error');
            });
        });

        document.getElementById('loginBtn').addEventListener('click', async function () {
            const apiErr = document.getElementById('api-error');
            const apiErrText = document.getElementById('api-error-text');
            apiErr.classList.add('d-none');
            if (!validateForm()) {
                return;
            }
            setLoading(true);
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        usernameOrEmail: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                if (res.ok) {
                    window.location.href = '/';
                    return;
                }
                let msg = '用户名或密码错误，请重新登录';
                try {
                    const body = await res.json();
                    if (body && body.detail) {
                        msg = body.detail;
                    }
                } catch (e) {
                }
                apiErrText.textContent = msg;
                apiErr.classList.remove('d-none');
            } catch (e) {
                apiErrText.textContent = '网络异常，请稍后再试';
                apiErr.classList.remove('d-none');
            } finally {
                setLoading(false);
            }
        });
    });
</script>
</body>
</html>
