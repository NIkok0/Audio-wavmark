<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="commonHead">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top wm-glass-nav" th:fragment="navbar">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/}">
            <span class="wm-brand-mark"><i class="bi bi-stars"></i></span>
            <span>数字水印系统</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#wmNav" aria-label="展开导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="wmNav">
            <form class="d-flex ms-lg-4 my-3 my-lg-0 wm-search" role="search" th:action="@{/search}" method="get" sec:authorize="isAuthenticated()">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input class="form-control" type="search" name="q" placeholder="搜索文件"/>
                </div>
            </form>
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-sm wm-nav-pill" th:href="@{/profile/retention}"><i class="bi bi-clock-history"></i> 文件保留</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">
                    <a class="btn btn-sm wm-nav-pill" th:href="@{/admin/permission}"><i class="bi bi-people"></i> 权限管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/feedback}">反馈</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text small text-secondary">你好，<span sec:authentication="name">用户</span></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/signout}">退出</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/signin}">登录</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm wm-primary-btn" th:href="@{/register}">注册</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<aside class="wm-sidebar" th:fragment="sidebar" sec:authorize="isAuthenticated()">
    <div class="sidebar-title"><i class="bi bi-grid-1x2-fill"></i> 媒体工作台</div>
    <a th:href="@{/image/process}" th:classappend="${activeMedia == 'image'} ? 'active'"><i class="bi bi-image"></i> 图片</a>
    <a th:href="@{/audio/process}" th:classappend="${activeMedia == 'audio'} ? 'active'"><i class="bi bi-music-note-beamed"></i> 音频</a>
    <a th:href="@{/video/process}" th:classappend="${activeMedia == 'video'} ? 'active'"><i class="bi bi-camera-reels"></i> 视频</a>
    <a th:href="@{/text/process}" th:classappend="${activeMedia == 'text'} ? 'active'"><i class="bi bi-file-earmark-text"></i> 文档</a>
</aside>

<th:block th:fragment="bootstrapJs">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
