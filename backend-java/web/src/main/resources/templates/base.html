<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<!-- 可复用片段：commonHead / navbar / sidebar / bootstrapJs -->
<head th:fragment="commonHead">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
    <style>
        .navbar-dark-brand { background-color: #343a40 !important; }
        .navbar-dark-brand .nav-link, .navbar-dark-brand .navbar-brand { color: #fff !important; }
        .app-sidebar {
            position: fixed; top: 56px; left: 0; width: 220px; bottom: 0;
            background: #343a40; color: #e5e7eb; z-index: 1000; padding: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,.1);
        }
        .app-sidebar a { color: #e5e7eb; display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; }
        .app-sidebar a:hover { background: #495057; color: #fff; }
        .app-sidebar a.active { background: #0d6efd; color: #fff; font-weight: 600; }
        .app-sidebar .sidebar-title { font-weight: 700; color: #fff; padding: 8px 10px; margin-bottom: 8px; }
        body { padding-top: 56px; }
        .with-sidebar { margin-left: 220px; }
    </style>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-dark-brand fixed-top">
    <div class="container-fluid px-3">
        <a class="navbar-brand" th:href="@{/}">数字水印系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#wmNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="wmNav">
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form class="d-flex" role="search" method="get" th:action="@{/search}">
                        <input class="form-control form-control-sm" type="search" name="q" placeholder="搜索文件名"
                               th:value="${param.q}"/>
                        <button class="btn btn-sm btn-outline-light ms-1" type="submit">搜索</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/profile/retention}">文件保留</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/admin/permission}">权限管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-1" th:href="@{/feedback}">反馈</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text text-white-50 small">欢迎，<span sec:authentication="name">用户</span></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link py-1" th:href="@{/signout}">退出</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link py-1" th:href="@{/signin}">登录</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link py-1" th:href="@{/register}">注册</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<aside th:fragment="sidebar" sec:authorize="isAuthenticated()" class="app-sidebar">
    <div class="sidebar-title">媒体处理</div>
    <a th:href="@{/image/process}" th:classappend="${activeMedia == 'image'} ? 'active'">图片</a>
    <a th:href="@{/audio/process}" th:classappend="${activeMedia == 'audio'} ? 'active'">音频</a>
    <a th:href="@{/video/process}" th:classappend="${activeMedia == 'video'} ? 'active'">视频</a>
    <a th:href="@{/text/process}" th:classappend="${activeMedia == 'text'} ? 'active'">文档</a>
</aside>

<th:block th:fragment="bootstrapJs">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>
</html>
