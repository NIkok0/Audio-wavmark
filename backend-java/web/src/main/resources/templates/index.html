<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>首页 - 数字水印系统</title>
    <th:block th:replace="~{base :: commonHead}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<aside th:replace="~{base :: sidebar}"></aside>

<main th:classappend="${#authorization.expression('isAuthenticated()')} ? ' with-sidebar' : ''" class="container py-4">
    <section class="wm-page-hero mb-4">
        <div>
            <span class="wm-kicker">Watermark Studio</span>
            <h1 class="display-6 fw-black wm-gradient-text mb-2">数字水印工作台</h1>
            <p class="lead text-secondary mb-0">上传图片、音频、视频和文档，提交水印任务并追踪处理状态。</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn wm-primary-btn px-4" sec:authorize="!isAuthenticated()" th:href="@{/signin}">立即登录</a>
            <a class="btn wm-primary-btn px-4" sec:authorize="isAuthenticated()" th:href="@{/image/process}">开始处理</a>
            <a class="btn btn-outline-secondary px-4" th:href="@{/feedback}">反馈问题</a>
        </div>
    </section>

    <section class="row g-3 mb-4">
        <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">全站文件</div><div class="fs-3 fw-bold" id="g-total">-</div></div></div></div>
        <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">全站容量</div><div class="fs-3 fw-bold" id="g-size">-</div></div></div></div>
        <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">已加水印</div><div class="fs-3 fw-bold" id="g-wm">-</div></div></div></div>
        <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">原始文件</div><div class="fs-3 fw-bold" id="g-raw">-</div></div></div></div>
    </section>

    <section class="row g-4 mb-4">
        <div class="col-lg-6"><div class="card h-100 wm-card"><div class="card-header">媒体类型分布</div><div class="card-body"><canvas id="chartGlobalTypes" height="220"></canvas></div></div></div>
        <div class="col-lg-6"><div class="card h-100 wm-card"><div class="card-header">近 14 天上传趋势</div><div class="card-body"><canvas id="chartGlobalSeries" height="220"></canvas></div></div></div>
    </section>

    <section class="wm-panel" sec:authorize="isAuthenticated()">
        <h2 class="h5 mb-3 fw-bold">我的文件概览</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">我的文件</div><div class="fs-3 fw-bold" id="u-total">-</div></div></div></div>
            <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">我的容量</div><div class="fs-3 fw-bold" id="u-size">-</div></div></div></div>
            <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">已加水印</div><div class="fs-3 fw-bold" id="u-wm">-</div></div></div></div>
            <div class="col-md-3"><div class="card h-100 border-0 wm-stat-card"><div class="card-body"><div class="text-secondary small">原始文件</div><div class="fs-3 fw-bold" id="u-raw">-</div></div></div></div>
        </div>
        <div class="row g-4">
            <div class="col-lg-6"><div class="card h-100 wm-card"><div class="card-header">我的媒体分布</div><div class="card-body"><canvas id="chartUserTypes" height="220"></canvas></div></div></div>
            <div class="col-lg-6"><div class="card h-100 wm-card"><div class="card-header">我的 14 天趋势</div><div class="card-body"><canvas id="chartUserSeries" height="220"></canvas></div></div></div>
        </div>
    </section>

    <section class="alert alert-info" sec:authorize="!isAuthenticated()">
        登录后可以查看个人统计、上传文件并提交水印处理任务。
        <a th:href="@{/signin}" class="alert-link">去登录</a>
    </section>
</main>
<th:block th:replace="~{base :: bootstrapJs}"/>
<script>
    function formatSize(bytes) {
        if (!bytes && bytes !== 0) {
            return '-';
        }
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = Number(bytes);
        let index = 0;
        while (size >= 1024 && index < units.length - 1) {
            size = size / 1024;
            index++;
        }
        return size.toFixed(index === 0 ? 0 : 1) + ' ' + units[index];
    }

    function lineChart(id, labels, data) {
        const ctx = document.getElementById(id);
        if (!ctx) {
            return null;
        }
        return new Chart(ctx, {
            type: 'line',
            data: {labels: labels, datasets: [{label: '上传量', data: data, borderColor: '#ff7ab6', backgroundColor: 'rgba(255,122,182,.16)', fill: true, tension: 0.32}]},
            options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true}}, maintainAspectRatio: false}
        });
    }

    function doughnutChart(id, labels, data) {
        const ctx = document.getElementById(id);
        if (!ctx) {
            return null;
        }
        return new Chart(ctx, {
            type: 'doughnut',
            data: {labels: labels, datasets: [{data: data, backgroundColor: ['#ff7ab6', '#ffb86b', '#7bdff2', '#95e1a3']}]},
            options: {plugins: {legend: {position: 'bottom'}}, maintainAspectRatio: false}
        });
    }

    function fillStats(prefix, stats) {
        const set = (id, value) => {
            const el = document.getElementById(prefix + id);
            if (el) {
                el.textContent = value;
            }
        };
        set('total', stats.totalFiles ?? '-');
        set('size', formatSize(stats.totalBytes));
        set('wm', stats.watermarkedFiles ?? '-');
        set('raw', stats.originalFiles ?? '-');
    }

    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const res = await fetch('/api/v1/stats/dashboard', {credentials: 'same-origin'});
            if (!res.ok) {
                return;
            }
            const data = await res.json();
            fillStats('g-', data.global || {});
            fillStats('u-', data.user || {});
            const globalTypes = data.global?.byType || {};
            const userTypes = data.user?.byType || {};
            doughnutChart('chartGlobalTypes', Object.keys(globalTypes), Object.values(globalTypes));
            doughnutChart('chartUserTypes', Object.keys(userTypes), Object.values(userTypes));
            const globalSeries = data.global?.dailyUploads || [];
            const userSeries = data.user?.dailyUploads || [];
            lineChart('chartGlobalSeries', globalSeries.map(x => x.date), globalSeries.map(x => x.count));
            lineChart('chartUserSeries', userSeries.map(x => x.date), userSeries.map(x => x.count));
        } catch (e) {
        }
    });
</script>
</body>
</html>
