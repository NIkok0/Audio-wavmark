name: copilot-agent Phase4 quality CI

on:
  push:
    branches: [main, master]
    paths:
      - "copilot-agent/eval/**"
      - "copilot-agent/scripts/verify_phase4_dataset.py"
      - "copilot-agent/scripts/verify_phase4_ragas.py"
      - "copilot-agent/scripts/verify_phase4_overall.py"
      - "copilot-agent/scripts/refresh_phase4_baseline.py"
      - ".github/workflows/copilot-agent-phase4-ci.yml"
  pull_request:
    paths:
      - "copilot-agent/eval/**"
      - "copilot-agent/scripts/verify_phase4_dataset.py"
      - "copilot-agent/scripts/verify_phase4_ragas.py"
      - "copilot-agent/scripts/verify_phase4_overall.py"
      - "copilot-agent/scripts/refresh_phase4_baseline.py"
      - ".github/workflows/copilot-agent-phase4-ci.yml"

concurrency:
  group: copilot-agent-phase4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: copilot-agent

jobs:
  phase4-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Prepare phase4 artifact directory
        run: mkdir -p artifacts/phase4

      - name: Verify Phase 4 eval dataset
        id: verify_phase4_dataset
        run: |
          python scripts/verify_phase4_dataset.py --summary-json artifacts/phase4/phase4-dataset-summary.json | tee artifacts/phase4/phase4-dataset-result.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path("artifacts/phase4/phase4-dataset-summary.json").read_text(encoding="utf-8"))
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"pass_line={summary['phase4_dataset']}\n")
              f.write(f"total_cases={summary['total_cases']}\n")
              f.write(f"blocked_cases={summary['blocked_cases']}\n")
              f.write(f"errors_count={len(summary.get('errors', []))}\n")
          PY

      - name: Verify Phase 4 RAG quality
        id: verify_phase4_ragas
        run: |
          python scripts/verify_phase4_ragas.py --mode auto --disable-vector --summary-json artifacts/phase4/phase4-ragas-summary.json | tee artifacts/phase4/phase4-ragas-result.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path("artifacts/phase4/phase4-ragas-summary.json").read_text(encoding="utf-8"))
          out = Path(os.environ["GITHUB_OUTPUT"])
          proxy = summary.get("proxy_metrics", {})
          with out.open("a", encoding="utf-8") as f:
              f.write(f"pass_line={summary['phase4_ragas']}\n")
              f.write(f"eval_mode={summary.get('eval_mode', 'proxy')}\n")
              f.write(f"docs_cases={proxy.get('docs_cases', 0)}\n")
              f.write(f"retrieval_hit_rate={proxy.get('retrieval_hit_rate', 0.0)}\n")
              f.write(f"required_source_full_match_rate={proxy.get('required_source_full_match_rate', 0.0)}\n")
              f.write(f"avg_required_source_coverage={proxy.get('avg_required_source_coverage', 0.0)}\n")
          PY

      - name: Verify Phase 4 overall rules and trend
        id: verify_phase4_overall
        run: |
          python scripts/verify_phase4_overall.py \
            --dataset eval/phase4-eval-cases.json \
            --dataset-summary artifacts/phase4/phase4-dataset-summary.json \
            --ragas-summary artifacts/phase4/phase4-ragas-summary.json \
            --baseline-json eval/phase4-baseline.json \
            --summary-json artifacts/phase4/phase4-overall-summary.json | tee artifacts/phase4/phase4-overall-result.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path("artifacts/phase4/phase4-overall-summary.json").read_text(encoding="utf-8"))
          out = Path(os.environ["GITHUB_OUTPUT"])
          trend = summary.get("trend_vs_baseline", {})
          with out.open("a", encoding="utf-8") as f:
              f.write(f"pass_line={summary['phase4_overall']}\n")
              f.write(f"rules_pass={summary.get('step_status', {}).get('phase4_rules', 'FAIL')}\n")
              f.write(f"retrieval_hit_rate_delta={trend.get('retrieval_hit_rate', {}).get('delta', 0.0)}\n")
              f.write(
                  "required_source_full_match_rate_delta="
                  f"{trend.get('required_source_full_match_rate', {}).get('delta', 0.0)}\n"
              )
              f.write(
                  "avg_required_source_coverage_delta="
                  f"{trend.get('avg_required_source_coverage', {}).get('delta', 0.0)}\n"
              )
          PY

      - name: Publish Phase 4 summary
        if: always()
        run: |
          echo "## copilot-agent Phase 4 quality summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Dataset integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL: \`${{ steps.verify_phase4_dataset.outputs.pass_line }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- total_cases: \`${{ steps.verify_phase4_dataset.outputs.total_cases }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- blocked_cases: \`${{ steps.verify_phase4_dataset.outputs.blocked_cases }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- errors_count: \`${{ steps.verify_phase4_dataset.outputs.errors_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### RAG quality (Step 2)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL: \`${{ steps.verify_phase4_ragas.outputs.pass_line }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- eval_mode: \`${{ steps.verify_phase4_ragas.outputs.eval_mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- docs_cases: \`${{ steps.verify_phase4_ragas.outputs.docs_cases }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- retrieval_hit_rate: \`${{ steps.verify_phase4_ragas.outputs.retrieval_hit_rate }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- required_source_full_match_rate: \`${{ steps.verify_phase4_ragas.outputs.required_source_full_match_rate }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- avg_required_source_coverage: \`${{ steps.verify_phase4_ragas.outputs.avg_required_source_coverage }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Overall rules + trend (Step 3)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL: \`${{ steps.verify_phase4_overall.outputs.pass_line }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rules_pass: \`${{ steps.verify_phase4_overall.outputs.rules_pass }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- retrieval_hit_rate_delta: \`${{ steps.verify_phase4_overall.outputs.retrieval_hit_rate_delta }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- required_source_full_match_rate_delta: \`${{ steps.verify_phase4_overall.outputs.required_source_full_match_rate_delta }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- avg_required_source_coverage_delta: \`${{ steps.verify_phase4_overall.outputs.avg_required_source_coverage_delta }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phase4 verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-quality-result-${{ github.run_number }}
          path: |
            copilot-agent/artifacts/phase4/phase4-dataset-result.txt
            copilot-agent/artifacts/phase4/phase4-dataset-summary.json
            copilot-agent/artifacts/phase4/phase4-ragas-result.txt
            copilot-agent/artifacts/phase4/phase4-ragas-summary.json
            copilot-agent/artifacts/phase4/phase4-overall-result.txt
            copilot-agent/artifacts/phase4/phase4-overall-summary.json
          retention-days: 7
          if-no-files-found: ignore

  phase4-refresh-baseline:
    needs: phase4-quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Download phase4 artifacts
        uses: actions/download-artifact@v4
        with:
          name: phase4-quality-result-${{ github.run_number }}
          path: .

      - name: Refresh baseline from overall summary
        run: |
          python copilot-agent/scripts/refresh_phase4_baseline.py \
            --overall-summary copilot-agent/artifacts/phase4/phase4-overall-summary.json \
            --baseline-json copilot-agent/eval/phase4-baseline.json \
            --git-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Commit refreshed baseline
        run: |
          git add copilot-agent/eval/phase4-baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(copilot-agent): refresh phase4 baseline metrics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
