name: copilot-agent Phase3 orchestration CI

on:
  push:
    branches: [main, master]
    paths:
      - "copilot-agent/**"
      - ".github/workflows/copilot-agent-phase3-ci.yml"
  pull_request:
    paths:
      - "copilot-agent/**"
      - ".github/workflows/copilot-agent-phase3-ci.yml"

concurrency:
  group: copilot-agent-phase3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: copilot-agent

jobs:
  phase3-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare regression artifact directory
        run: mkdir -p artifacts/phase3

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install minimal Phase 3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic-settings>=2.2.0" \
            "langgraph>=0.2.40,<0.3.0" \
            "langgraph-checkpoint-sqlite>=2.0.0,<3.0.0" \
            "langchain-core>=0.3.0,<0.4.0"

      - name: Verify Phase 3 checkpoint resume
        id: verify_checkpoint
        continue-on-error: true
        run: |
          python scripts/verify_phase3_checkpoint.py --summary-json artifacts/phase3/phase3-checkpoint-summary.json | tee artifacts/phase3/phase3-checkpoint-result.txt

      - name: Verify Phase 3 safety gate block
        id: verify_safety_gate
        if: always()
        continue-on-error: true
        run: |
          python scripts/verify_phase3_safety_gate.py --summary-json artifacts/phase3/phase3-safety-gate-summary.json | tee artifacts/phase3/phase3-safety-gate-result.txt

      - name: Collect Phase 3 outputs
        id: collect_phase3
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path, defaults):
              p = Path(path)
              if not p.exists():
                  return defaults
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return defaults

          checkpoint = load(
              "artifacts/phase3/phase3-checkpoint-summary.json",
              {
                  "phase3_step4": "FAIL",
                  "state_resumed": False,
                  "tool_path_executed": False,
                  "checkpoint_file_exists": False,
                  "messages_after_turn1": -1,
                  "messages_after_turn2": -1,
              },
          )
          safety = load(
              "artifacts/phase3/phase3-safety-gate-summary.json",
              {
                  "phase3_safety_gate": "FAIL",
                  "blocked_by_gate": False,
                  "tool_not_called": False,
                  "tool_message_seen": True,
                  "http_post_calls": -1,
              },
          )

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"checkpoint_pass_line={checkpoint['phase3_step4']}\n")
              f.write(f"state_resumed={checkpoint['state_resumed']}\n")
              f.write(f"tool_path_executed={checkpoint['tool_path_executed']}\n")
              f.write(f"checkpoint_file_exists={checkpoint['checkpoint_file_exists']}\n")
              f.write(f"messages_after_turn1={checkpoint['messages_after_turn1']}\n")
              f.write(f"messages_after_turn2={checkpoint['messages_after_turn2']}\n")
              f.write(f"safety_gate_pass_line={safety['phase3_safety_gate']}\n")
              f.write(f"blocked_by_gate={safety['blocked_by_gate']}\n")
              f.write(f"tool_not_called={safety['tool_not_called']}\n")
              f.write(f"tool_message_seen={safety['tool_message_seen']}\n")
              f.write(f"http_post_calls={safety['http_post_calls']}\n")
          PY

      - name: Enforce Phase 3 regressions
        if: always()
        run: |
          if [ "${{ steps.collect_phase3.outputs.checkpoint_pass_line }}" != "PASS" ]; then
            echo "Checkpoint regression failed."
            exit 1
          fi
          if [ "${{ steps.collect_phase3.outputs.safety_gate_pass_line }}" != "PASS" ]; then
            echo "Safety gate regression failed."
            exit 1
          fi

      - name: Publish Phase 3 summary
        if: always()
        run: |
          echo "## copilot-agent Phase 3 orchestration summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checkpoint resume" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL: \`${{ steps.collect_phase3.outputs.checkpoint_pass_line }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- state_resumed: \`${{ steps.collect_phase3.outputs.state_resumed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tool_path_executed: \`${{ steps.collect_phase3.outputs.tool_path_executed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- checkpoint_file_exists: \`${{ steps.collect_phase3.outputs.checkpoint_file_exists }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- messages_after_turn1: \`${{ steps.collect_phase3.outputs.messages_after_turn1 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- messages_after_turn2: \`${{ steps.collect_phase3.outputs.messages_after_turn2 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Safety gate block" >> "$GITHUB_STEP_SUMMARY"
          echo "- PASS/FAIL: \`${{ steps.collect_phase3.outputs.safety_gate_pass_line }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- blocked_by_gate: \`${{ steps.collect_phase3.outputs.blocked_by_gate }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tool_not_called: \`${{ steps.collect_phase3.outputs.tool_not_called }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tool_message_seen: \`${{ steps.collect_phase3.outputs.tool_message_seen }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- http_post_calls: \`${{ steps.collect_phase3.outputs.http_post_calls }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-checkpoint-db-${{ github.run_number }}
          path: copilot-agent/storage/langgraph-checkpoints.sqlite
          retention-days: 7
          if-no-files-found: error

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-regression-result-${{ github.run_number }}
          path: |
            copilot-agent/artifacts/phase3/phase3-checkpoint-result.txt
            copilot-agent/artifacts/phase3/phase3-checkpoint-summary.json
            copilot-agent/artifacts/phase3/phase3-safety-gate-result.txt
            copilot-agent/artifacts/phase3/phase3-safety-gate-summary.json
          retention-days: 7
          if-no-files-found: ignore
